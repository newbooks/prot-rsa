[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "prot-rsa"
version = "1.0.1"
description = "Fast protein residue surface-area calculation in Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Junjun Mao" },
]
keywords = [
    "bioinformatics",
    "computational biology",
    "protein",
    "residue surface area",
    "structural biology",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy",
    "scipy",
    "numba",
]

[project.urls]
Homepage = "https://github.com/newbooks/prot-rsa"
Repository = "https://github.com/newbooks/prot-rsa"
Issues = "https://github.com/newbooks/prot-rsa/issues"
Changelog = "https://github.com/newbooks/prot-rsa/blob/main/HISTORY.md"
Documentation = "https://github.com/newbooks/prot-rsa/blob/main/README.md"

[project.scripts]
prot-rsa = "protrsa:main"

[tool.setuptools]
include-package-data = true
py-modules = ["protrsa"]
